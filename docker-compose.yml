name: uamishop-app

services:
  mysql:
    image: mysql:latest
    container_name: uamishop-mysql
    environment:
      MYSQL_DATABASE: uamishop
      MYSQL_USER: uamishop
      MYSQL_PASSWORD: uamishop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # EL MONOLITO
  uamishop:
    build:
      context: ./uamiShop  # <-- Ruta a la carpeta del monolito
      dockerfile: Dockerfile
    image: uamishop-monolito:latest
    container_name: uamishop
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: "jdbc:mysql://uamishop-mysql:3306/uamishop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      CATALOGO_SERVICE_URL: "http://catalog-service:8080" # Comunicación interna (puerto del contenedor)
      SPRING_RABBITMQ_HOST: uamishop-rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # EL MICROSERVICIO DE CATÁLOGO
  catalog-service:
    build:
      context: ./uamishop-catalogo # <-- Ruta a la carpeta del nuevo proyecto
      dockerfile: Dockerfile
    image: uamishop-catalogo:latest
    container_name: catalog-service
    ports:
      - "8081:8081" # Acceso externo por 8081, interno 8080
    environment:
      SPRING_PROFILES_ACTIVE: mysql,catalogo-local
      # Si creaste la base de datos separada, cambia /uamishop por /uamishop_catalogo
      SPRING_DATASOURCE_URL: "jdbc:mysql://uamishop-mysql:3306/uamishop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: uamishop
      SPRING_DATASOURCE_PASSWORD: uamishop
      SPRING_RABBITMQ_HOST: uamishop-rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: uamishop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data: