server:
  port: 9000

spring:
  application:
    name: uamishop-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: catalogo-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/productos/**, /api/v1/categorias/**
          
        - id: ventas-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/carritos/**
            
        - id: ordenes-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/ordenes/**
