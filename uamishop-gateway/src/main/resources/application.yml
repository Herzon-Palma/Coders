server:
  port: 8080

spring:
  application:
    name: uamishop-gateway
  cloud:
    gateway:
      routes:
        - id: catalogo-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/productos/**
            
        - id: ordenes-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/ordenes/**
            
        - id: ventas-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/carritos/**
