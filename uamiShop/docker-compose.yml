name: uamishop-app
services:
  mysql:
    # ... (Se queda igual, pero asegúrate de tener el script SQL si usas otra DB)
    image: mysql:latest
    container_name: uamishop-mysql
    environment:
      MYSQL_DATABASE: uamishop
      MYSQL_USER: uamishop
      MYSQL_PASSWORD: uamishop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  uamishop:
    build:
      context: .
      dockerfile: Dockerfile
    image: uamishop:latest
    container_name: uamishop
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/uamishop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"   
      # CORRECCIÓN 1: Usar puerto interno 8080
      CATALOGO_SERVICE_URL: "http://catalog-service:8080" 
      # CORRECCIÓN 2: Host de Rabbit
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  catalog-service:
    image: uamishop:latest
    container_name: catalog-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql,catalogo-local
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/uamishop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"      
      SPRING_DATASOURCE_PASSWORD: uamishop
      # CORRECCIÓN 3: Host de Rabbit
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: uamishop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data: